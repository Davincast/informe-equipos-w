<!DOCTYPE html>
<html lang="es">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe Ejecutivo · Disponibilidad de Equipos</title>

  <!-- Fuentes desde CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Librerías JS desde CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Configuración de Tailwind -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F8FAFC',
            panel: '#FFFFFF',
            panel2: '#F1F5F9',
            border: '#E2E8F0',
            cyan: '#0891B2',
            green: '#059669',
            orange: '#EA580C',
            red: '#DC2626',
            purple: '#7C3AED',
            ink: '#0F172A',
            sub: '#64748B',
          }
        }
      }
    }
  </script>

  <!-- Estilos personalizados -->
  <style>
    html, body { background: #F8FAFC; font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #F1F5F9; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    .badge { display:inline-flex; align-items:center; gap:2px; font-size:9px; font-weight:700; padding:1px 4px; border-radius:9999px; line-height: 1; }
  </style>
</head>

<body class="bg-bg text-ink min-h-screen flex flex-col justify-between">

  <!-- Pantalla de Carga Inicial -->
  <div id="drop-zone-container" class="flex-1 flex flex-col items-center justify-center p-8">
    <div class="max-w-md w-full bg-panel p-8 rounded-xl border border-border shadow-sm text-center">
      <div class="w-16 h-16 bg-cyan/10 text-cyan rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
      </div>
      <h2 class="text-xl font-bold mb-2">Informe Ejecutivo</h2>
      <p class="text-sub text-sm mb-6">Arrastra y suelta tu archivo Excel <span class="mono text-xs bg-panel2 px-1.5 py-0.5 rounded">.xlsx</span> aquí o selecciona un archivo para continuar.</p>
      
      <label class="cursor-pointer bg-cyan hover:bg-cyan/90 text-white font-semibold px-4 py-2.5 rounded-lg transition-colors inline-block">
        <span>Seleccionar archivo Excel</span>
        <input type="file" id="excel-file" accept=".xlsx, .xls" class="hidden">
      </label>
      <div id="file-name" class="mt-3 text-xs text-sub truncate"></div>
    </div>
  </div>

  <!-- Dashboard Principal (Oculto hasta cargar archivo) -->
  <div id="dashboard" class="hidden p-4 md:p-6 flex-1 flex flex-col gap-4">
    
    <!-- Encabezado -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-4 border-b border-border gap-2">
      <div>
        <h1 class="text-2xl font-black text-ink">Informe Ejecutivo · Disponibilidad de Equipos</h1>
        <p class="text-sub text-xs">Análisis operativo de indicadores clave de rendimiento (KPIs)</p>
      </div>
      <button onclick="location.reload()" class="text-xs bg-panel2 hover:bg-border text-ink px-3 py-1.5 rounded transition-colors font-semibold">
        Cargar otro archivo
      </button>
    </header>

    <!-- Tarjetas KPI -->
    <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
      <div class="bg-panel p-3 rounded-lg border border-border shadow-sm">
        <div class="text-[10px] uppercase font-bold text-sub mb-1">Total Equipos</div>
        <div id="kpi-total" class="text-2xl font-black text-ink mono">-</div>
      </div>
      <div class="bg-panel p-3 rounded-lg border border-border shadow-sm">
        <div class="text-[10px] uppercase font-bold text-green mb-1">Operativos</div>
        <div id="kpi-operativos" class="text-2xl font-black text-green mono">-</div>
      </div>
      <div class="bg-panel p-3 rounded-lg border border-border shadow-sm">
        <div class="text-[10px] uppercase font-bold text-orange mb-1">Mantenimiento</div>
        <div id="kpi-mantenimiento" class="text-2xl font-black text-orange mono">-</div>
      </div>
      <div class="bg-panel p-3 rounded-lg border border-border shadow-sm">
        <div class="text-[10px] uppercase font-bold text-red mb-1">Inoperativos</div>
        <div id="kpi-inoperativos" class="text-2xl font-black text-red mono">-</div>
      </div>
      <div class="bg-panel p-3 rounded-lg border border-border shadow-sm">
        <div class="text-[10px] uppercase font-bold text-cyan mb-1">Disponibilidad</div>
        <div id="kpi-disponibilidad" class="text-2xl font-black text-cyan mono">-%</div>
      </div>
    </div>

    <!-- Contenedor de Gráficos -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 flex-1">
      <div class="lg:col-span-4 bg-panel p-4 rounded-xl border border-border shadow-sm min-h-[250px] flex flex-col justify-center">
        <canvas id="chart-disponibilidad"></canvas>
      </div>
      <div class="lg:col-span-8 bg-panel p-4 rounded-xl border border-border shadow-sm min-h-[250px] flex flex-col justify-center">
        <canvas id="chart-estados"></canvas>
      </div>
    </div>

  </div>

  <!-- Script Lógico de Procesamiento -->
  <script>
    if (typeof ChartDataLabels !== 'undefined') {
      Chart.register(ChartDataLabels);
    }

    const fileInput = document.getElementById('excel-file');
    const fileNameDiv = document.getElementById('file-name');

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      fileNameDiv.textContent = file.name;
      const reader = new FileReader();

      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet);

        procesarDatos(jsonData);
      };

      reader.readAsArrayBuffer(file);
    });

    function procesarDatos(data) {
      document.getElementById('drop-zone-container').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');

      let total = data.length;
      let operativos = 0;
      let mantenimiento = 0;
      let inoperativos = 0;

      data.forEach(row => {
        const estado = String(row.Estado || row.ESTADO || row.estado || '').toLowerCase();
        if (estado.includes('operativo') || estado.includes('disponible') || estado.includes('ok')) {
          operativos++;
        } else if (estado.includes('mantenimiento') || estado.includes('taller') || estado.includes('revision')) {
          mantenimiento++;
        } else {
          inoperativos++;
        }
      });

      const dispPorcentaje = total > 0 ? ((operativos / total) * 100).toFixed(1) : 0;

      document.getElementById('kpi-total').textContent = total;
      document.getElementById('kpi-operativos').textContent = operativos;
      document.getElementById('kpi-mantenimiento').textContent = mantenimiento;
      document.getElementById('kpi-inoperativos').textContent = inoperativos;
      document.getElementById('kpi-disponibilidad').textContent = dispPorcentaje + '%';

      renderCharts(operativos, mantenimiento, inoperativos);
    }

    let chartD, chartE;

    function renderCharts(op, mant, inop) {
      const ctxD = document.getElementById('chart-disponibilidad').getContext('2d');
      const ctxE = document.getElementById('chart-estados').getContext('2d');

      if (chartD) chartD.destroy();
      if (chartE) chartE.destroy();

      chartD = new Chart(ctxD, {
        type: 'doughnut',
        data: {
          labels: ['Operativos', 'Mantenimiento', 'Inoperativos'],
          datasets: [{
            data: [op, mant, inop],
            backgroundColor: ['#059669', '#EA580C', '#DC2626']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom' },
            title: { display: true, text: 'Distribución de Estado' }
          }
        }
      });

      chartE = new Chart(ctxE, {
        type: 'bar',
        data: {
          labels: ['Operativos', 'Mantenimiento', 'Inoperativos'],
          datasets: [{
            label: 'Cantidad de Equipos',
            data: [op, mant, inop],
            backgroundColor: ['#059669', '#EA580C', '#DC2626']
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            title: { display: true, text: 'Detalle General por Categoría' }
          }
        }
      });
    }
  </script>
</body>
</html>
