<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informe Ejecutivo · Disponibilidad de Equipos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F8FAFC', panel: '#FFFFFF', panel2: '#F1F5F9', border: '#E2E8F0',
            cyan: '#0891B2', green: '#059669', orange: '#EA580C', red: '#DC2626',
            purple: '#7C3AED', ink: '#0F172A', sub: '#64748B',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { background: #F8FAFC; font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-bg text-ink h-screen overflow-hidden flex flex-col">

<div id="loaderScreen" class="h-full flex flex-col items-center justify-center px-4">
  <div class="max-w-md w-full text-center bg-panel p-6 rounded-xl border border-border shadow-sm">
    <div id="spinner" class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-cyan mb-3"></div>
    <h1 class="text-xl font-bold text-ink mb-1">Cargando Informe Ejecutivo...</h1>
    <p class="text-sub text-xs mb-4">Buscando pestaña <strong class="text-ink">Digitacion</strong> en <code class="text-cyan">Analisis_pwq.xlsx</code>:</p>

    <div class="mb-4">
      <label for="fileInput" class="block w-full cursor-pointer bg-cyan/10 hover:bg-cyan/25 border border-cyan/30 text-cyan text-xs font-semibold py-3 px-4 rounded-lg transition-colors">
        📁 O seleccionar archivo manualmente (.xlsx)
      </label>
      <input type="file" id="fileInput" accept=".xlsx, .xls" class="hidden">
    </div>

    <div id="loadError" class="hidden text-xs text-red bg-red/10 border border-red/30 rounded p-3 text-left max-h-48 overflow-y-auto"></div>
  </div>
</div>

<div id="dashboard" class="hidden h-full w-full flex flex-col p-4">
  <h1 class="text-lg font-bold text-ink">¡Cargado con éxito!</h1>
  <p id="infoExito" class="text-sm text-sub"></p>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);

  function showLoadError(msg){
    const el = $('loadError');
    el.innerHTML = msg;
    el.classList.remove('hidden');
    $('spinner').classList.add('hidden');
  }

  $('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array', cellDates: true });
        processWorkbook(wb);
      } catch (err) {
        showLoadError(`Error al leer archivo: ${err.message}`);
      }
    };
    reader.readAsArrayBuffer(file);
  });

  async function tryAutoLoad() {
    try {
      const res = await fetch('Analisis_pwq.xlsx', { cache: 'no-cache' });
      if (res.ok) {
        const arrayBuffer = await res.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array', cellDates: true });
        processWorkbook(wb);
      } else {
        showLoadError(`No se pudo descargar automáticamente "Analisis_pwq.xlsx" desde el servidor (Error HTTP ${res.status}). Usa el botón manual de arriba.`);
      }
    } catch (e) {
      showLoadError(`Error de red al buscar el archivo en el servidor. Usa el botón manual de arriba.`);
    }
  }

  window.addEventListener('DOMContentLoaded', tryAutoLoad);

  function processWorkbook(wb){
    if (!wb.SheetNames || wb.SheetNames.length === 0) {
      showLoadError("El archivo Excel no contiene pestañas.");
      return;
    }

    // Listar pestañas disponibles para diagnóstico
    const sheetsList = wb.SheetNames.join(', ');

    // Buscar la pestaña que contenga "digitac" (ej. Digitacion, Digitación)
    const targetSheetName = wb.SheetNames.find(s => {
      const norm = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      return norm.includes('digitac');
    });

    if (!targetSheetName) {
      showLoadError(`No se encontró ninguna pestaña llamada <strong>"Digitacion"</strong>.<br><br>Pestañas que sí existen en tu Excel:<br><code>${sheetsList}</code>`);
      return;
    }

    const sheet = wb.Sheets[targetSheetName];
    const json = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: true });

    if (!json || json.length === 0) {
      showLoadError(`La pestaña <strong>"${targetSheetName}"</strong> fue encontrada pero está completamente vacía.`);
      return;
    }

    $('loaderScreen').classList.add('hidden');
    $('dashboard').classList.remove('hidden');$('infoExito').textContent = `Se leyeron ${json.length} filas correctamente desde la pestaña "${targetSheetName}".`;
  }
})();
</script>
</body>
</html>
