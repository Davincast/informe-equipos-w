<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPC - VIA LACTEA | Análisis de Disponibilidad</title>
    
    <!-- Librerías requeridas -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8fafc; color: #1e293b; }
        .header { background: #0f172a; color: white; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; background: #fbbf24; color: #000; font-weight: bold; }
        .status-badge.success { background: #22c55e; color: white; }
        .status-badge.error { background: #ef4444; color: white; }
        /* Agrega aquí el resto de tus estilos CSS originales */
    </style>
</head>
<body>

    <div class="header">
        <h2>Dashboard de Disponibilidad y Eficiencia - EPC VIA LACTEA</h2>
        <span id="estadoCarga" class="status-badge">Cargando datos automáticamente...</span>
    </div>

    <!-- AQUÍ VA TU ESTRUCTURA HTML DE FILTROS, KPIS Y TABLAS ORIGINALES -->

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Se usa encodeURI para soportar nombres de archivos con espacios
            const nombreArchivo = "Analisis pwq.xlsx"; 
            const rutaExcel = "./" + encodeURIComponent(nombreArchivo);

            const badgeEstado = document.getElementById("estadoCarga");

            fetch(rutaExcel)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("No se pudo obtener el archivo del servidor.");
                    }
                    return response.arrayBuffer();
                })
                .then(buffer => {
                    // Leer el libro de trabajo Excel
                    const workbook = XLSX.read(buffer, { type: 'array' });
                    
                    // Seleccionar la pestaña 'Digitacion' o la primera disponible
                    const nombrePestana = workbook.SheetNames.includes("Digitacion") ? "Digitacion" : workbook.SheetNames[0];
                    const hoja = workbook.Sheets[nombrePestana];
                    
                    // Convertir los datos de la hoja a JSON
                    const datosJSON = XLSX.utils.sheet_to_json(hoja);

                    if (datosJSON && datosJSON.length > 0) {
                        badgeEstado.textContent = "Datos cargados automáticamente";
                        badgeEstado.className = "status-badge success";
                        
                        // Llama a las funciones originales de procesamiento de tu tablero
                        procesarDatosOriginales(datosJSON);
                    } else {
                        throw new Error("El archivo no contiene registros en la hoja seleccionada.");
                    }
                })
                .catch(error => {
                    console.error("Error al cargar el Excel:", error);
                    badgeEstado.textContent = "Error al cargar datos automáticos";
                    badgeEstado.className = "status-badge error";
                });
        });

        function procesarDatosOriginales(datos) {
            console.log("Datos cargados correctamente:", datos);
            // Inserta aquí las funciones que construyen tus gráficos y tablas
        }
    </script>
</body>
</html>
